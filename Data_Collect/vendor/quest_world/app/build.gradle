buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
}
repositories { google(); mavenCentral() }
apply plugin: 'com.android.application'

android {
    namespace 'com.piper.questinput'
    compileSdk 32
    buildToolsVersion '33.0.1'
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.piper.questinput'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                targets 'piperquestworld'
                arguments '-DANDROID_STL=c++_shared', "-DMETA_SDK_SOURCE_DIR=${project.findProperty('metaSdkDir') ?: ''}"
            }
        }
    }
    externalNativeBuild { cmake { path file('CMakeLists.txt'); version '3.22.1' } }
    buildFeatures { prefab true }
    packagingOptions { jniLibs { pickFirsts += ['**/libopenxr_loader.so'] } }
}
dependencies { implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.53' }
